name: Unit tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  vitest:
    name: Theme & onboarding unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run vitest suite
        run: bun run test -- --reporter=default

      - name: Themes count & meta-description guard (SEO copy)
        # Runs the focused /themes count + meta-description tests on every
        # PR to catch stale SEO copy when WEDDING_THEMES changes.
        run: bun run test -- --reporter=default src/pages/Themes.count.test.tsx